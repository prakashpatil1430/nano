name: CI/CD Pipeline

on:
  push:
    branches: [dev, cicd-new]
  pull_request:
    branches: [qa-release, 'qa-release-*']
  workflow_dispatch:
    inputs:
      env_selection:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - prod
      branch_name:
        description: "Branch Name (prod or prod_*)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      REF: ${{ steps.logic.outputs.REF }}
    steps:
      - id: logic
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"

          # 1. Handle Push (Strict branches only)
          if [[ "$EVENT" == "push" ]]; then
            REF_VAL="${{ github.ref_name }}"
            if [[ "$REF_VAL" == "dev" || "$REF_VAL" == "cicd-new" ]]; then
              RAW_ENV="$REF_VAL"
              RAW_STAGE="$REF_VAL"
              REF_OUTPUT="$REF_VAL"
            fi

          # 2. Handle Pull Request (Dynamic QA extraction)
          elif [[ "$EVENT" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            if [[ "$BASE_REF" == "qa-release" || "$BASE_REF" == qa-release-* ]]; then
              RAW_ENV="${BASE_REF%%-*}"
              RAW_STAGE="$RAW_ENV"
              REF_OUTPUT="${{ github.head_ref }}"
            fi

          # 3. Handle Manual Dispatch (Prod with validation)
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            RAW_ENV="${{ inputs.env_selection }}"
            REF_OUTPUT="${{ inputs.branch_name }}"
            RAW_STAGE="$RAW_ENV"
            
            if [[ "$REF_OUTPUT" != "prod" && "$REF_OUTPUT" != prod_* ]]; then
              echo "❌ ERROR: Invalid branch for prod deployment"
              exit 1 
            fi
          fi

          # Final output writing
          echo "ENV=${RAW_ENV,,}" >> $GITHUB_OUTPUT
          echo "STAGE=${RAW_STAGE,,}" >> $GITHUB_OUTPUT
          echo "REF=$REF_OUTPUT" >> $GITHUB_OUTPUT

          # Debugging section
          echo "--- RESOLVED VALUES ---"
          echo "ENV: ${RAW_ENV,,}"
          echo "STAGE: ${RAW_STAGE,,}"
          echo "REF: $REF_OUTPUT"
          echo "-----------------------"

  pipeline:
    needs: resolve
    runs-on: ubuntu-latest
    # Ensure this job only runs if resolve actually found an environment
    if: needs.resolve.outputs.ENV != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.REF }}

      - name: Execute Deployment
        run: |
          echo "🚀 Deploying to Environment: ${{ needs.resolve.outputs.ENV }}"
          echo "🛠️  Using Stage: ${{ needs.resolve.outputs.STAGE }}"
          echo "📂 From Branch: ${{ needs.resolve.outputs.REF }}"
