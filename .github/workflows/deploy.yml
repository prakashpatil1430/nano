name: t360 backend 123

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [dev, qa-release, 'qa-release-*']
    types: [closed] # Only triggers when closed/merged
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (prod only)"
        required: true
        type: choice
        options: [prod]
      branch:
        description: "Prod branch (must start with prod_*)"
        required: true
        type: string

jobs:
  resolve:
    name: Resolve Environment
    runs-on: ubuntu-latest
    # Only run if it's a merge OR a manual dispatch
    if: |
      (github.event.pull_request.merged == true) || 
      (github.event_name == 'workflow_dispatch')
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      BRANCH: ${{ steps.logic.outputs.BRANCH }}
      ROLE: ${{ steps.logic.outputs.ROLE }}
    steps:
      - id: logic
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            if [[ "$BASE_REF" == "dev" ]]; then
              ENV="dev"
              STAGE="dev"
              ROLE="${{ secrets.AWS_NONPROD_ROLE_ARN }}"
            elif [[ "$BASE_REF" == qa-release* ]]; then
              ENV="qa"
              STAGE="qa"
              ROLE="${{ secrets.AWS_NONPROD_ROLE_ARN }}"
            else
              # 2. FAIL-SAFE: If a PR somehow hits another branch, kill the job.
              echo "::error::Automated deployment not allowed for branch: $BASE_REF"
              exit 1
            fi
            
            BRANCH="$BASE_REF"
          elif
            # Manual Prod Dispatch
            ENV="prod"
            STAGE="prod"
            BRANCH="${{ github.event.inputs.branch }}"
            if [[ "$BRANCH" != prod_* ]]; then echo "Invalid branch"; exit 1; fi
            ROLE="${{ secrets.AWS_PROD_ROLE_ARN }}"
          fi

          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "STAGE=$STAGE" >> $GITHUB_OUTPUT
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
          echo "ROLE=$ROLE" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.ENV }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.ENV }}
    # --- ADD THIS BLOCK ---
    env:
      ENV: ${{ needs.resolve.outputs.ENV }}
      STAGE: ${{ needs.resolve.outputs.STAGE }}
      ROLE: ${{ needs.resolve.outputs.ROLE }}
    # ----------------------
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.BRANCH }}

      - name: Deploy Step
        run: |
          echo "env IS $ENV"     # Now this will work!
          echo "stage IS $STAGE" # Now this will work!
