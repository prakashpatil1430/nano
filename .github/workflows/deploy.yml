name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, cicd-new]
  pull_request:
    branches: [qa-release, 'qa-release-*']
  workflow_dispatch:
    inputs:
      env_selection:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - prod
      branch_name:
        description: "Branch Name (prod or prod_*)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      REF: ${{ steps.logic.outputs.REF }}

    steps:
      - id: logic
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"

          # 1. Handle Push (Dev, QA, cicd-new)
          if [[ "$EVENT" == "push" ]]; then
            REF_VAL="${{ github.ref_name }}"
            if [[ "$REF_VAL" == "dev" || "$REF_VAL" == "qa" || "$REF_VAL" == "cicd-new" ]]; then
              RAW_ENV="$REF_VAL"
              RAW_STAGE="$REF_VAL"
            else
              RAW_ENV="${REF_VAL%%-*}"
              RAW_STAGE="${RAW_ENV^^}"
            fi
            REF_OUTPUT="$REF_VAL"

          # 2. Handle Pull Request (QA)
          elif [[ "$EVENT" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            REF_OUTPUT="${{ github.head_ref }}"
            if [[ "$BASE_REF" == "qa-release" || "$BASE_REF" == qa-release-* ]]; then
              RAW_ENV="${BASE_REF%%-*}"
              RAW_STAGE="$RAW_ENV"
            else
              RAW_ENV="${BASE_REF%%-*}"
              RAW_STAGE="${RAW_ENV^^}"
            fi

          # 3. Handle Manual Dispatch (Prod)
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            RAW_ENV="${{ inputs.env_selection }}"
            REF_OUTPUT="${{ inputs.branch_name }}"
            RAW_STAGE="${RAW_ENV^^}"
            
            # Use an IF instead of EXIT to keep the script running for logs
            if [[ "$REF_OUTPUT" != "prod" && "$REF_OUTPUT" != prod_* ]]; then
              echo "❌ ERROR: Invalid branch for prod"
              # We still exit 1 here because we WANT the job to fail on bad input
              exit 1 
            fi
          fi

          # ---------------------------------------------------
          # FINAL WRITING & DEBUGGING
          # ---------------------------------------------------
          echo "ENV=${RAW_ENV,,}" >> $GITHUB_OUTPUT
          echo "STAGE=${RAW_STAGE,,}" >> $GITHUB_OUTPUT
          echo "REF=$REF_OUTPUT" >> $GITHUB_OUTPUT

          echo "--- DEBUGGING OUTPUT ---"
          echo "Final ENV: ${RAW_ENV,,}"
          echo "Final STAGE: ${RAW_STAGE,,}"
          echo "Final REF: $REF_OUTPUT"
          echo "------------------------"
          cat $GITHUB_OUTPUT


