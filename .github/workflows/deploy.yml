name: CI/CD Pipeline

on:
  push:
    branches: [dev, cicd-new]
  pull_request:
    branches: [qa-release, 'qa-release-*']
  workflow_dispatch:
    inputs:
      env_selection:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - prod
      branch_name:
        description: "Branch Name (prod or prod_*)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      REF: ${{ steps.logic.outputs.REF }}

    steps:
      - id: logic
        shell: bash
        run: |
          set -e
          EVENT="${{ github.event_name }}"

          # 1. Handle Push (Dev)
          if [[ "$EVENT" == "push" ]]; then
            REF_VAL="${{ github.ref_name }}"
            if [[ "$REF_VAL" == "dev" ]]; then
              echo "ENV=dev" >> $GITHUB_OUTPUT
              echo "STAGE=dev" >> $GITHUB_OUTPUT
              echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
              exit 0
            fi
            RAW_VAL="$REF_VAL"

          # 2. Handle Pull Request (QA)
          elif [[ "$EVENT" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            REF_VAL="${{ github.head_ref }}"
            
            # Specific check for "qa-release" or "qa-release-"
            if [[ "$BASE_REF" == "qa-release" || "$BASE_REF" == qa-release-* ]]; then
              # Dynamically extracts prefix before the first '-' (e.g., 'qa')
              DYNAMIC_VAL="${BASE_REF%%-*}"
              echo "ENV=${DYNAMIC_VAL,,}" >> $GITHUB_OUTPUT
              echo "STAGE=${DYNAMIC_ENV,,}" >> $GITHUB_OUTPUT # Fixed to use same dynamic value
              echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
              exit 0
            fi
            RAW_VAL="${BASE_REF%%-*}"

          # 3. Handle Manual Dispatch (Prod)
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            ENV_INPUT="${{ inputs.env_selection }}"
            REF_INPUT="${{ inputs.branch_name }}"
            
            if [[ "$REF_INPUT" == "prod" || "$REF_INPUT" == prod_* ]]; then
              RAW_VAL="$ENV_INPUT"
              REF_VAL="$REF_INPUT"
            else
              echo "❌ Error: Prod requires branch 'prod' or 'prod_*'"
              exit 1
            fi
          fi

          # Default logic (e.g., cicd-new or fallback)
          echo "ENV=${RAW_VAL,,}" >> $GITHUB_OUTPUT
          echo "STAGE=${RAW_VAL^^}" >> $GITHUB_OUTPUT
          echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
