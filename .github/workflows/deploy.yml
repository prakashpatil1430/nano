name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, cicd-new]
  pull_request:
    branches: [qa-release, 'qa-release-*']
  workflow_dispatch:
    inputs:
      env_selection:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - prod
      branch_name:
        description: "Branch Name (prod or prod_*)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      REF: ${{ steps.logic.outputs.REF }}

    steps:
      - id: logic
        shell: bash
        run: |
          set -e
          EVENT="${{ github.event_name }}"

          # 1. Handle Push (Dev, QA, or Others)
          if [[ "$EVENT" == "push" ]]; then
            REF_VAL="${{ github.ref_name }}"
            
            # Condition: If branch is exactly 'dev' OR exactly 'qa'
            if [[ "$REF_VAL" == "dev" || "$REF_VAL" == "cicd-new" ]]; then
              echo "ENV=$REF_VAL" >> $GITHUB_OUTPUT
              echo "STAGE=$REF_VAL" >> $GITHUB_OUTPUT
              echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Dynamic extraction for others (e.g., cicd-new -> cicd)
            RAW_VAL="${REF_VAL%%-*}"

          # 2. Handle Pull Request (QA Release)
          elif [[ "$EVENT" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            REF_VAL="${{ github.head_ref }}"
            
            if [[ "$BASE_REF" == "qa-release" || "$BASE_REF" == qa-release-* ]]; then
              DYNAMIC_VAL="${BASE_REF%%-*}"
              echo "ENV=${DYNAMIC_VAL,,}" >> $GITHUB_OUTPUT
              echo "STAGE=${DYNAMIC_VAL,,}" >> $GITHUB_OUTPUT
              echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
              exit 0
            fi
            RAW_VAL="${BASE_REF%%-*}"

          # 3. Handle Manual Dispatch (Prod)
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            ENV_INPUT="${{ inputs.env_selection }}"
            REF_INPUT="${{ inputs.branch_name }}"
            
            if [[ "$REF_INPUT" == "prod" || "$REF_INPUT" == prod_* ]]; then
              RAW_VAL="$ENV_INPUT"
              REF_VAL="$REF_INPUT"
            else
              echo "❌ Error: Prod requires branch 'prod' or 'prod_*'"
              exit 1
            fi
          fi

          # Default logic for fallback branches
          echo "ENV=${RAW_VAL,,}" >> $GITHUB_OUTPUT
          echo "STAGE=${RAW_VAL^^}" >> $GITHUB_OUTPUT
          echo "REF=$REF_VAL" >> $GITHUB_OUTPUT
