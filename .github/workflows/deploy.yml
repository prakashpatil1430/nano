name: CI/CD Pipeline

# Standard practice: Prevent overlapping runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev, cicd-new]
  pull_request:
    branches: [qa-release, 'qa-release-*']
  workflow_dispatch:
    inputs:
      env_selection:
        description: "Select Environment"
        required: true
        type: choice
        options: [prod]
      branch_name:
        description: "Branch Name (prod or prod_*)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      REF: ${{ steps.logic.outputs.REF }}
    steps:
      - id: logic
        shell: bash
        run: |
          # Use local variables for cleaner bash processing
          EVENT="${{ github.event_name }}"
          RAW_ENV=""
          REF_OUT=""

          case "$EVENT" in
            "push")
              REF_VAL="${{ github.ref_name }}"
              # Only process our primary CI branches
              if [[ "$REF_VAL" =~ ^(dev|cicd-new)$ ]]; then
                RAW_ENV="$REF_VAL"
                REF_OUT="$REF_VAL"
              fi
              ;;
              
            "pull_request")
              BASE="${{ github.base_ref }}"
              # Standard: Extract environment prefix (e.g., 'qa') from 'qa-release'
              if [[ "$BASE" == qa-release* ]]; then
                RAW_ENV="${BASE%%-*}"
                REF_OUT="${{ github.head_ref }}"
              fi
              ;;

            "workflow_dispatch")
              # Standard: Manual prod deployments
              RAW_ENV="${{ inputs.env_selection }}"
              REF_OUT="${{ inputs.branch_name }}"
              if [[ "$REF_OUT" != "prod" && "$REF_OUT" != prod_* ]]; then
                echo "::error::Invalid branch for Prod"
                exit 1
              fi
              ;;
          esac

          # Standard: Fail the job if no environment was resolved
          if [[ -z "$RAW_ENV" ]]; then
            echo "::error::Could not resolve environment for $EVENT on ${{ github.ref_name }}"
            exit 1
          fi

          # Standard: Unified output formatting
          echo "ENV=${RAW_ENV,,}" >> $GITHUB_OUTPUT
          echo "STAGE=${RAW_ENV,,}" >> $GITHUB_OUTPUT
          echo "REF=$REF_OUT" >> $GITHUB_OUTPUT

  pipeline:
    needs: resolve
    runs-on: ubuntu-latest
    # Environment allows for manual approvals in GitHub UI
    environment: ${{ needs.resolve.outputs.ENV }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.REF }}
      
      - name: Deploy
        run: |
          echo "Deploying ${{ needs.resolve.outputs.REF }} to ${{ needs.resolve.outputs.ENV }}"
