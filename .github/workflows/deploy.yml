name: t360 backend 123

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [dev, qa-release, 'qa-release-*']
    types: [closed]

jobs:
  resolve:
    name: Resolve Environment
    runs-on: ubuntu-latest
    # Only run steps if the PR was actually merged
    if: github.event.pull_request.merged == true
    outputs:
      ENV: ${{ steps.logic.outputs.ENV }}
      STAGE: ${{ steps.logic.outputs.STAGE }}
      BRANCH: ${{ steps.logic.outputs.BRANCH }}
      ROLE: ${{ steps.logic.outputs.ROLE }}
    steps:
      - id: logic
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref }}"
          
          if [[ "$BASE_REF" == "dev" ]]; then
            ENV="dev"
            STAGE="dev"
            ROLE="${{ secrets.AWS_NONPROD_ROLE_ARN }}"
          elif [[ "$BASE_REF" == qa-release* ]]; then
            ENV="qa"
            STAGE="qa"
            ROLE="${{ secrets.AWS_NONPROD_ROLE_ARN }}"
          fi
          
          BRANCH="$BASE_REF"

          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "STAGE=$STAGE" >> $GITHUB_OUTPUT
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
          echo "ROLE=$ROLE" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.ENV }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.ENV }}
    env:
      ENV: ${{ needs.resolve.outputs.ENV }}
      STAGE: ${{ needs.resolve.outputs.STAGE }}
      ROLE: ${{ needs.resolve.outputs.ROLE }}
      BRANCH: ${{ needs.resolve.outputs.BRANCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Deploy Step
        run: |
          echo "🚀 Deployment Started"
          echo "Target Env    : $ENV"
          echo "Target Stage  : $STAGE"
          echo "Target Branch : $BRANCH"
          # Standard practice: Do not echo the ROLE secret directly for security
